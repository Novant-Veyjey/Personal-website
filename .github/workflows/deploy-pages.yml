name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/holo-card-deck/cards
          cp index.html main.html stranger-entry.html dist/
          cp -r assets dist/
          cp -r holo-card-deck/web dist/holo-card-deck/
          cp -r holo-card-deck/source dist/holo-card-deck/
          for i in 01 02 03 04 05; do
            mkdir -p "dist/holo-card-deck/cards/card-$i"
            cp -r "holo-card-deck/cards/card-$i/web" "dist/holo-card-deck/cards/card-$i/"
          done
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
