<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090706">
  <title>诡异入口</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #080706;
      --wall: #171311;
      --blood: #6f1017;
      --blood-bright: #a31b23;
      --blood-dim: #2f060a;
      --bone: #dbc8b1;
      --moss: #352f20;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: var(--ink);
      color: var(--bone);
      font-family: "Baskerville", "Palatino Linotype", "Songti SC", "STSong", serif;
    }

    button {
      font: inherit;
    }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: clamp(24px, 6vw, 88px);
      background:
        radial-gradient(circle at 18% 15%, rgba(118, 27, 30, 0.2), transparent 23%),
        radial-gradient(circle at 84% 72%, rgba(56, 69, 57, 0.19), transparent 28%),
        radial-gradient(circle at 54% 50%, rgba(62, 46, 37, 0.24), transparent 34%),
        linear-gradient(142deg, #100d0c 0%, #211b17 42%, #0b0908 100%);
    }

    .scene::before,
    .scene::after {
      position: absolute;
      inset: -10%;
      z-index: -2;
      content: "";
      pointer-events: none;
    }

    .scene::before {
      opacity: 0.72;
      background:
        radial-gradient(ellipse at 14% 74%, rgba(4, 7, 6, 0.96) 0 4%, transparent 24%),
        radial-gradient(ellipse at 77% 19%, rgba(42, 7, 10, 0.75) 0 3%, transparent 23%),
        radial-gradient(ellipse at 62% 86%, rgba(3, 4, 4, 0.93) 0 7%, transparent 28%),
        radial-gradient(ellipse at 32% 38%, rgba(80, 58, 40, 0.24) 0 3%, transparent 20%);
      filter: blur(18px);
    }

    .scene::after {
      background:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.13) 1px, transparent 1px);
      background-size: 97px 83px, 71px 109px;
      opacity: 0.23;
      transform: rotate(-0.35deg) scale(1.08);
    }

    .wall-cracks {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      opacity: 0.8;
      pointer-events: none;
    }

    .wall-cracks .crack {
      fill: none;
      stroke: #030303;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      vector-effect: non-scaling-stroke;
    }

    .wall-cracks .crack-glow {
      fill: none;
      stroke: rgba(110, 10, 16, 0.26);
      stroke-linecap: square;
      vector-effect: non-scaling-stroke;
    }

    .damp-stains {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .damp-stains span {
      position: absolute;
      display: block;
      border-radius: 48% 52% 44% 56% / 60% 42% 58% 40%;
      background:
        radial-gradient(ellipse at 45% 36%, rgba(55, 67, 50, 0.3), rgba(19, 24, 20, 0.52) 48%, transparent 72%);
      filter: blur(15px);
      opacity: 0.6;
      mix-blend-mode: multiply;
    }

    .damp-stains span:nth-child(1) {
      top: 6%;
      left: 5%;
      width: 22%;
      height: 34%;
      transform: rotate(15deg);
    }

    .damp-stains span:nth-child(2) {
      right: 3%;
      bottom: 8%;
      width: 28%;
      height: 39%;
      transform: rotate(-21deg);
    }

    .damp-stains span:nth-child(3) {
      top: 50%;
      left: 2%;
      width: 17%;
      height: 21%;
      transform: rotate(41deg);
    }

    .entry-zone {
      position: relative;
      width: min(78vw, 820px);
      aspect-ratio: 1.84 / 1;
      perspective: 1100px;
      touch-action: manipulation;
    }

    .entry-zone::before {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 62%;
      height: 56%;
      border-radius: 50%;
      content: "";
      pointer-events: none;
      background: rgba(120, 10, 18, 0.18);
      box-shadow:
        0 0 38px rgba(126, 12, 22, 0.34),
        0 0 110px rgba(88, 8, 15, 0.25);
      filter: blur(22px);
      transform: translate(-50%, -50%) scale(0.92);
      animation: ember-breathe 4.8s ease-in-out infinite;
    }

    .vine-field {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      filter:
        drop-shadow(0 6px 4px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 5px rgba(22, 42, 21, 0.52));
      transform-origin: center;
      animation: vine-tremor 7s ease-in-out infinite;
    }

    .vine-field .stem {
      fill: none;
      stroke: url("#vine-gradient");
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .vine-field .stem-shadow {
      fill: none;
      stroke: rgba(2, 2, 2, 0.88);
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: translate(5px, 7px);
      vector-effect: non-scaling-stroke;
    }

    .vine-field .thorn {
      fill: #19180f;
      stroke: #070805;
      stroke-width: 1.25;
      filter: drop-shadow(1px 2px 1px #030303);
    }

    .vine-field .leaf {
      fill: url("#leaf-gradient");
      stroke: #080a05;
      stroke-width: 1.5;
      filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.9));
    }

    .vine-field .leaf-vein {
      fill: none;
      stroke: rgba(117, 106, 66, 0.32);
      stroke-linecap: round;
    }

    .entry-button {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      width: min(56%, 430px);
      min-width: 280px;
      aspect-ratio: 2.26 / 1;
      padding: 22px 44px 25px;
      border: 0;
      clip-path: polygon(
        2% 13%, 7% 6%, 17% 8%, 27% 3%, 40% 6%, 53% 2%, 68% 7%,
        79% 3%, 91% 9%, 98% 19%, 96% 39%, 100% 55%, 96% 72%, 99% 87%,
        89% 96%, 74% 93%, 61% 98%, 49% 94%, 36% 99%, 23% 95%, 9% 98%,
        1% 86%, 4% 69%, 0 52%, 4% 35%
      );
      background:
        linear-gradient(107deg, transparent 0 18%, rgba(132, 16, 26, 0.18) 18.5% 19%, transparent 19.5%),
        linear-gradient(82deg, transparent 0 63%, rgba(129, 25, 29, 0.2) 63.5% 64.2%, transparent 64.7%),
        repeating-linear-gradient(98deg, transparent 0 11px, rgba(184, 42, 43, 0.035) 12px, transparent 14px),
        radial-gradient(circle at 50% 44%, #32211c 0 13%, #1b1512 41%, #0b0908 78%);
      box-shadow:
        inset 0 0 0 3px rgba(81, 8, 14, 0.82),
        inset 0 0 0 9px rgba(6, 5, 5, 0.72),
        inset 0 0 38px rgba(0, 0, 0, 0.98);
      color: var(--bone);
      cursor: pointer;
      outline: none;
      transform: translate(-50%, -50%) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      transition:
        transform 180ms ease,
        filter 240ms ease,
        background-color 240ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .entry-button::before,
    .entry-button::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .entry-button::before {
      inset: 13px 17px;
      border: 1px solid rgba(118, 19, 25, 0.54);
      clip-path: polygon(0 9%, 10% 0, 31% 3%, 48% 0, 72% 4%, 100% 8%, 97% 91%, 79% 98%, 55% 94%, 35% 100%, 8% 95%);
      box-shadow:
        inset 0 0 13px rgba(33, 0, 2, 0.84),
        0 0 7px rgba(116, 12, 18, 0.18);
      opacity: 0.88;
    }

    .entry-button::after {
      inset: 0;
      background:
        linear-gradient(115deg, transparent 0 7%, rgba(255, 219, 177, 0.045) 7.2% 7.8%, transparent 8% 100%),
        repeating-radial-gradient(ellipse at 32% 42%, transparent 0 8px, rgba(188, 139, 103, 0.028) 9px, transparent 10px);
      mix-blend-mode: screen;
      opacity: 0.82;
    }

    .entry-label {
      position: relative;
      z-index: 2;
      display: block;
      color: #b7a28c;
      font-size: clamp(2.2rem, 6vw, 4.25rem);
      font-style: normal;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.12em;
      text-align: center;
      text-indent: 0.12em;
      text-shadow:
        0 1px 0 #050303,
        0 0 5px rgba(118, 11, 18, 0.84),
        0 0 15px rgba(92, 4, 11, 0.42);
      -webkit-text-stroke: 1.4px var(--blood-dim);
      paint-order: stroke fill;
      transform: translateZ(18px);
      transition: color 180ms ease, text-shadow 180ms ease;
    }

    .entry-button:hover,
    .entry-button:focus-visible {
      filter:
        brightness(1.12)
        drop-shadow(0 0 9px rgba(140, 14, 22, 0.56))
        drop-shadow(0 0 32px rgba(105, 8, 16, 0.3));
    }

    .entry-button:hover .entry-label,
    .entry-button:focus-visible .entry-label {
      color: #d2bda5;
      text-shadow:
        0 1px 0 #050303,
        0 0 7px rgba(177, 20, 30, 0.9),
        0 0 22px rgba(123, 6, 15, 0.68);
    }

    .entry-button:active {
      transform: translate(-50%, -50%) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) scale(0.975);
    }

    .entry-button.is-entering {
      pointer-events: none;
      filter:
        brightness(1.26)
        drop-shadow(0 0 13px rgba(199, 23, 34, 0.92))
        drop-shadow(0 0 52px rgba(145, 8, 18, 0.65));
      animation: entry-pulse 720ms ease-out both;
    }

    .entry-button.is-entering .entry-label {
      color: #ead7c0;
    }

    .grain {
      position: fixed;
      inset: -28%;
      z-index: 20;
      width: 156%;
      height: 156%;
      pointer-events: none;
      opacity: 0.18;
      mix-blend-mode: soft-light;
      animation: grain-shift 0.24s steps(2, end) infinite;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 19;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 38%, rgba(0, 0, 0, 0.38) 72%, rgba(0, 0, 0, 0.88) 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.58), transparent 20% 80%, rgba(0, 0, 0, 0.58));
    }

    .threshold {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: #000;
      opacity: 0;
      transition: opacity 850ms ease-in;
    }

    .threshold span {
      color: #ab1a24;
      font-size: clamp(0.8rem, 2vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
      text-shadow: 0 0 14px #8f0b17;
      opacity: 0;
    }

    body.entering .threshold {
      opacity: 1;
    }

    body.entering .threshold span {
      animation: threshold-label 700ms 600ms ease-out forwards;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes ember-breathe {
      0%,
      100% {
        opacity: 0.46;
        transform: translate(-50%, -50%) scale(0.92);
      }
      50% {
        opacity: 0.76;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    @keyframes vine-tremor {
      0%,
      94%,
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      95% {
        transform: translate3d(-1px, 1px, 0) rotate(0.12deg);
      }
      96% {
        transform: translate3d(1px, -1px, 0) rotate(-0.1deg);
      }
    }

    @keyframes grain-shift {
      0% {
        transform: translate3d(0, 0, 0);
      }
      25% {
        transform: translate3d(-1.8%, 1.2%, 0);
      }
      50% {
        transform: translate3d(1.4%, -1.7%, 0);
      }
      75% {
        transform: translate3d(1.1%, 1.8%, 0);
      }
      100% {
        transform: translate3d(-1.5%, -0.9%, 0);
      }
    }

    @keyframes entry-pulse {
      0% {
        opacity: 1;
      }
      42% {
        opacity: 0.72;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes threshold-label {
      to {
        opacity: 0.88;
      }
    }

    @media (max-width: 680px) {
      .scene {
        padding: 18px;
      }

      .entry-zone {
        width: min(94vw, 520px);
        aspect-ratio: 1.28 / 1;
      }

      .entry-button {
        width: min(72%, 330px);
        min-width: 238px;
        padding: 18px 22px 21px;
      }

      .vine-field {
        width: 112%;
        height: 100%;
        margin-left: -6%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      .entry-button {
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>

          <path d="m48 235 38 21M139 202l39 28M220 162l38 18M309 125l42 21M399 106l41 21M486 86l44 17M581 50l45 17M676 34l39 17M98 134l40 21M185 121l41 12M290 103l44 12M403 82l41 8M518 49l43 4M624 25l42 -2M698 99l36 22M80 372l28 20M176 354l36 18M267 319l40 17M383 274l38 17M480 243l40 13M598 194l40 15M709 155l36 14" />

    <div class="vignette" aria-hidden="true"></div>
    <svg class="grain" viewBox="0 0 800 600" preserveAspectRatio="none" aria-hidden="true">
      <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="31" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer>
          <feFuncA type="table" tableValues="0 0.72" />
        </feComponentTransfer>
      </filter>
      <rect width="800" height="600" filter="url(#grain-filter)" />
    </svg>
  </div>

  <div class="threshold" aria-hidden="true">
    <span>入口已开启</span>
  </div>

  <script>
    (() => {
      const button = document.querySelector("#entryButton");
      const status = document.querySelector("#entryStatus");
      const entryZone = document.querySelector(".entry-zone");
      const canTilt = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let resetTimer;

      if (canTilt && !reduceMotion) {
        entryZone.addEventListener("pointermove", (event) => {
          if (button.classList.contains("is-entering")) return;
          const rect = entryZone.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width - 0.5;
          const y = (event.clientY - rect.top) / rect.height - 0.5;
          button.style.setProperty("--tilt-y", `${x * 7}deg`);
          button.style.setProperty("--tilt-x", `${y * -6}deg`);
        });

        entryZone.addEventListener("pointerleave", () => {
          button.style.setProperty("--tilt-y", "0deg");
          button.style.setProperty("--tilt-x", "0deg");
        });
      }

      button.addEventListener("click", () => {
        if (button.classList.contains("is-entering")) return;

        window.clearTimeout(resetTimer);
        button.classList.add("is-entering");
        document.body.classList.add("entering");
        status.textContent = "入口已开启";
        window.dispatchEvent(new CustomEvent("haunted-entry"));

        const destination = button.dataset.href;
        resetTimer = window.setTimeout(() => {
          if (destination && destination !== "#") {
            window.location.assign(destination);
            return;
          }

          button.classList.remove("is-entering");
          document.body.classList.remove("entering");
          status.textContent = "入口已重新封闭";
        }, 1450);
      });
    })();
  </script>
