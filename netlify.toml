[build]
  # 只把「真正要发布的东西」挑进 dist，再发布 dist。
  #
  # 之前 publish = "." 会把整个仓库根目录发出去，里面 holo-card-deck/
  # 有 4 万多份 Blender 中间产物和 .blend 源文件（合计 170MB+），
  # 结果：构建极慢、部署容易丢文件（卡片缩略图和脚本没上去），
  # 而且那些工程文件是公开可下载的。
  #
  # 现在只发布：
  #   index.html
  #   assets/                      站点样式、脚本、图片
  #   holo-card-deck/web/          卡片集合页 + 卡片缩略图
  #   holo-card-deck/cards/*/web/  5 个卡片详情页
  # 体积从 170MB+ 降到约 48MB，文件数从 4 万多降到一百多个。
  command = "mkdir -p dist/holo-card-deck/cards && cp index.html dist/ && cp -r assets dist/ && cp -r holo-card-deck/web dist/holo-card-deck/ && for i in 01 02 03 04 05; do mkdir -p dist/holo-card-deck/cards/card-$i; cp -r holo-card-deck/cards/card-$i/web dist/holo-card-deck/cards/card-$i/; done"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/messages/*"
  to = "/.netlify/functions/messages/:splat"
  status = 200
