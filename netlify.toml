[build]
  # 只把「真正要发布的东西」挑进 dist，再发布 dist。
  #
  # 之前 publish = "." 会把整个仓库根目录发出去，里面 holo-card-deck/
  # 有 4 万多份 Blender 中间产物和 .blend 源文件（合计 170MB+），
  # 结果：构建极慢、部署容易丢文件（卡片缩略图和脚本没上去），
  # 而且那些工程文件是公开可下载的。
  #
  # 现在只发布「页面跑起来真正需要的东西」：
  #   index.html
  #   assets/                       站点样式、脚本、图片
  #   holo-card-deck/web/           卡片集合页 + 5 张卡片缩略图
  #   holo-card-deck/source/        集合页用的 5 张生活照（仅 1.77MB）
  #   holo-card-deck/cards/*/web/   5 个卡片详情页（含 3D 模型 card.glb、分层贴图）
  #
  # 排除的只有 Blender 工程产物，与卡片运行无关：
  #   *.blend / *.blend1    48MB   建模源文件
  #   verification/*        46MB   渲染验证截图
  #   cards/*/assets/               分层源图（web/assets 里已有网页用的副本）
  #   tools/  references/           构建脚本与参考资料
  # 体积从 170MB+ 降到约 50MB，文件数从 4 万多降到一百多个。
  # dist 结构：
  #   index.html            根路径 stub（瞬间跳到 stranger-entry.html）
  #   stranger-entry.html   鬼屋入口页（iframe 加载 main.html 主站）
  #   main.html             主站本体
  command = "mkdir -p dist/holo-card-deck/cards && cp index.html dist/ && cp main.html dist/ && cp stranger-entry.html dist/ && cp -r assets dist/ && cp -r holo-card-deck/web dist/holo-card-deck/ && cp -r holo-card-deck/source dist/holo-card-deck/ && for i in 01 02 03 04 05; do mkdir -p dist/holo-card-deck/cards/card-$i; cp -r holo-card-deck/cards/card-$i/web dist/holo-card-deck/cards/card-$i/; done"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/messages/*"
  to = "/.netlify/functions/messages/:splat"
  status = 200

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile"
  status = 200

[[redirects]]
  from = "/api/posters"
  to = "/.netlify/functions/posters"
  status = 200

[[redirects]]
  from = "/api/posters/*"
  to = "/.netlify/functions/posters/:splat"
  status = 200
