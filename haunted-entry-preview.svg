<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">诡异入口按钮预览</title>
  <desc id="desc">旧墙裂纹中的暗红入口按钮，四周围绕藤蔓、污渍与胶片颗粒。</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b0a"/>
      <stop offset=".44" stop-color="#211a16"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="damp-red" cx=".2" cy=".12" r=".35">
      <stop offset="0" stop-color="#74141b" stop-opacity=".27"/>
      <stop offset="1" stop-color="#74141b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="damp-green" cx=".82" cy=".78" r=".4">
      <stop offset="0" stop-color="#3c4937" stop-opacity=".2"/>
      <stop offset="1" stop-color="#172019" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#851522" stop-opacity=".42"/>
      <stop offset=".44" stop-color="#5c0f18" stop-opacity=".17"/>
      <stop offset="1" stop-color="#4a0b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="button-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33231e"/>
      <stop offset=".28" stop-color="#1b1512"/>
      <stop offset=".7" stop-color="#14100e"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5840"/>
      <stop offset=".35" stop-color="#292c1d"/>
      <stop offset=".72" stop-color="#171b12"/>
      <stop offset="1" stop-color="#514e36"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#555138"/>
      <stop offset=".52" stop-color="#292b1c"/>
      <stop offset="1" stop-color="#11140e"/>
    </linearGradient>
    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="rough-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#000" flood-opacity=".94"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#75101a" flood-opacity=".34"/>
    </filter>
    <filter id="red-glow" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#8d0914" flood-opacity=".56"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="4" seed="27" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .58"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="button-clip">
      <path d="M640 420 684 392l84 12 82-24 100 17 90-29 108 27 83-17 95 39 46 75-12 104 26 84-16 92-76 55-109-17-98 29-92-24-105 32-101-21-104 24-110-18-47-66 20-85-23-87 24-104z"/>
    </clipPath>
  </defs>

